# mili continuous integration.
#
# Every third-party action is pinned to a full commit SHA. The tag is recorded in
# a trailing comment so the pin can be checked against the tag it came from.
#
# No job in this workflow has access to a signing key. The workflow has read-only
# repository permissions and no `secrets` are referenced anywhere in it. Release
# signing is not performed by CI; see SPEC.md section 17.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A stale lockfile must fail the build rather than silently resolving to a
  # different dependency set than the committed one.
  RUSTFLAGS: --deny warnings

jobs:
  check:
    name: fmt, clippy, test, deny
    runs-on: ubuntu-latest
    # Measured at five minutes. GitHub's default is six hours, so a step that
    # hangs — a test blocked on a lock, a prompt waiting for input, a dependency
    # resolution that never converges — holds a runner for six hours and says
    # nothing about which step it was. Every timeout here is several times the
    # measured time rather than a little above it, because a contended or slower
    # runner is normal and a false timeout is a red build that means nothing.
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Fail if the toolchain drifted from the pin
        run: |
          expected=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$expected" != "$actual" ]; then
            echo "rust-toolchain.toml pins $expected but CI built $actual" >&2
            exit 1
          fi

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check the lockfile is complete and current
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- --deny warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Build the documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Dependency policy
        run: cargo deny check

      # cargo-vet is a different question from cargo-deny, and both are here on
      # purpose. deny asks whether a crate is allowed: licence, features, no
      # duplicates, nothing in the advisory database. vet asks whether the code in
      # a crate is the code its publisher said it was.
      #
      # `cargo vet check` passing does NOT mean the tree is audited. It means every
      # crate is audited or exempted, and an exemption records that nobody has
      # looked rather than that a crate is fine. Read supply-chain/README.md.
      #
      # The version is pinned because cargo-vet reformats its store as part of
      # checking it, and two versions format supply-chain/audits.toml differently:
      # 0.10.0 escapes quotes inside notes and 0.10.2 does not. An unpinned
      # install took the newest GitHub release, which was 0.10.0 while crates.io
      # carried 0.10.2, so CI failed on a tree that passed locally with the same
      # source files. This is SPEC.md section 16 applied to the tools: the rule
      # is that a version is written down, not that the newest one is fetched.
      - name: Install cargo-vet
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-vet@0.10.2

      # Check, then format, then check again. The second check is the one that
      # matters: `cargo vet fmt` rewrites the store in place, so running it first
      # would let a reformat become the thing that is verified rather than the
      # thing that is checked. This way CI fails if the committed store is not in
      # the format this version writes, and says so as a diff.
      - name: Supply chain audits
        run: cargo vet check --locked

  miri:
    name: miri
    runs-on: ubuntu-latest
    # The longest job here at about eleven minutes, and the one most likely to get
    # slower: Miri's cost is superlinear in the test body, so adding a case to a
    # sweep moves this number a lot. Forty-five minutes is four times the measured
    # time, which leaves room for a slower runner without leaving room for a hang.
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install nightly with miri
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
          components: miri

      # The `+nightly` is not decoration. rust-toolchain.toml pins 1.98.0, and
      # rustup resolves a bare `cargo` to that pin, so `cargo miri` would ask for
      # a miri component that stable does not have and fail with a message
      # naming the wrong toolchain. `cargo +nightly` overrides the pin for this
      # one command, which is what this job wants: it is the only job that does
      # not use the pinned toolchain, because miri is nightly-only.
      - name: Prepare the miri sysroot
        run: cargo +nightly miri setup

      # `-Zmiri-disable-isolation` runs every test in one process instead of one
      # process per test. It removes a debugging aid, not a check: with it a
      # failure cannot be inspected in an attached debugger. It is worth about a
      # factor of two, which is the difference between a twelve minute job and a
      # six minute one.
      #
      # `-Zmiri-strict-provenance` costs nothing here, which is expected and is
      # also the honest reason to keep it: it catches integer-to-pointer casts,
      # and mili-core is `#![forbid(unsafe_code)]`, so there are none in the code
      # this job is checking. It is here for the day an `unsafe` block appears,
      # and as a standing statement that the absence is deliberate.
      #
      # The run is about six minutes: 76 library tests and 8 doctests. Tests that
      # call ML-KEM-768, X25519, ML-DSA-65, Ed25519 or Argon2id are excluded under
      # miri. `keyfile::derive_kek` panics under miri rather than deriving, so a
      # test that reaches it without `#[cfg(not(miri))]` fails with a message
      # naming the fix instead of hanging the job.
      - name: Tests under miri
        run: cargo +nightly miri test --locked -p mili-core
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-strict-provenance

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # About two minutes per target today. The headroom is deliberately large
    # because the first thing that changes when a target is slow is that someone
    # raises this budget, and a budget that has to be raised is cheaper than a
    # target that is killed before it finishes.
    timeout-minutes: 20
    strategy:
      # One target per job rather than one job for all of them, so a slow target
      # does not serialise behind the others and a failure names the target.
      fail-fast: false
      matrix:
        target:
          - open_sealed_box
          - open_stream
          - open_stream_fragments
          - open_key_file
          - open_backup
          - verify_signature
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # libFuzzer needs a nightly compiler. This is the one job that does not use the
      # pinned toolchain, and it never links the result: nothing here produces a
      # binary anyone runs.
      #
      # Do not add a `targets:` entry here. `rustup toolchain install --target`
      # for a non-host target installs it with --force-non-host, which makes it
      # the default for that toolchain, and cargo-fuzz then builds for musl.
      # ASan is incompatible with musl's static linking, so the job fails on its
      # first dependency with "sanitizer is incompatible with statically linked
      # libc". The default host target is the one that works.
      - name: Install nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly

      # `--target` is passed explicitly rather than left to whatever the host
      # default happens to be. This is the third failure on this job and the
      # second one caused by an ambient default: the first was a tool version
      # floating, this one is a target floating. Both are SPEC.md section 16's
      # rule, which says a value is written down.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-fuzz@0.13.2

      # The fuzz crate is outside the workspace, so it has its own lockfile and
      # its own dependency graph, and `cargo deny check` in the step below reads
      # fuzz/deny.toml rather than the root one. Neither follows from the other
      # being installed in the check job: each job gets a clean runner.
      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      - name: Check the fuzz lockfile is complete and current
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Dependency policy for the fuzz crate
        working-directory: fuzz
        run: cargo deny check

      # The recorded regressions. Passing files rather than a corpus directory
      # makes libFuzzer execute them and stop, instead of using them as seeds and
      # continuing to fuzz. This is what turns "someone reintroduced the bug the
      # fuzzer found once" into a build failure in seconds.
      - name: Replay the committed regressions
        working-directory: fuzz
        run: |
          shopt -s nullglob
          inputs=(regressions/${{ matrix.target }}/*)
          if [ ${#inputs[@]} -eq 0 ]; then
            echo "no regressions recorded for ${{ matrix.target }}"
            exit 0
          fi
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} "${inputs[@]}"

      # A short campaign. This is a smoke test, not a campaign: it proves the
      # target builds under the sanitizers and covers something, and it would
      # catch a target that had quietly stopped reaching its parser. A campaign
      # worth the name is run by a person against a corpus that grows; see
      # fuzz/README.md.
      - name: Fuzz for one minute
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- \
            -max_total_time=60 \
            -print_final_stats=1

      # A libFuzzer crash is a file, and without this step that file is only ever
      # in the runner's ephemeral disk and the job log's tail. The log says a
      # target crashed; it does not say with what, and libFuzzer's own summary
      # truncates the reproducer. This makes the input available to download, so a
      # crash can be replayed locally with the command in fuzz/README.md instead of
      # being rediscovered by fuzzing again.
      #
      # `if: failure()` rather than `if: success()`, because the likeliest crash to
      # happen is the one in the replay step above: a committed regression that no
      # longer reproduces as a crash but panics or aborts is still a failure worth
      # keeping the input for. `ignore` because a failure in an earlier step — a
      # cargo-deny finding, a missing lockfile — has no artifacts to upload, and an
      # upload that fails would replace the real error with a second one.
      #
      # Only the artifacts are uploaded, not the corpus. The corpus is what a
      # campaign accumulates to find bugs; here it would be a minute of noise, and
      # a corpus in an artifact would read as a corpus worth committing.
      - name: Upload the crashing input, if the target crashed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  ffi:
    name: mili-ffi and the Go binding
    runs-on: ubuntu-latest
    # About one minute, most of it installing Go. The headroom covers a cold Go
    # toolchain download and a cargo-deny install on an uncached runner.
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      # A full version, not a range. The binding uses cgo, and cgo has changed
      # between minor releases before.
      - name: Install Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: "1.24.6"

      - name: Build the library
        run: cargo build --locked --release -p mili-ffi

      # The library and the header are two artifacts that have to agree, and the test
      # that checks it needs the release build because that is what cgo links.
      - name: Test the boundary
        run: cargo test --locked -p mili-ffi

      - name: Vet the binding
        working-directory: bindings/go
        run: go vet ./...

      - name: Test the binding
        working-directory: bindings/go
        run: go test ./...
        env:
          # The binding links libmili_ffi.so from the release build rather than
          # installing it anywhere, so the loader has to be told where it is.
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release

  audit:
    name: advisory audit
    runs-on: ubuntu-latest
    # Two and a half minutes: installing three advisory tools and reading their
    # configuration. Fifteen minutes is enough that a slow install is not reported
    # as a policy failure.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Audit dependencies against the RustSec advisory database
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
