[workspace]
resolver = "3"
members = ["mili-core", "mili-ffi"]
# The fuzz targets are built by `cargo fuzz` with sanitizer flags that belong to
# the fuzz invocation, not to the library. Keeping the crate out of the workspace
# means a target cannot change how `mili-core` is built for `cargo test`.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/oqullcan/mili"
# Not published to crates.io. The repository is the distribution channel, and a
# published crate is a promise about API stability that 0.1.0 does not make.
publish = false

[workspace.dependencies]
zeroize = "=1.9.0"
getrandom = "=0.4.3"
subtle = { version = "=2.6.1", default-features = false }
hkdf = "=0.13.0"
sha2 = { version = "=0.11.0", default-features = false }
x-wing = { version = "=0.1.0", features = ["getrandom", "zeroize"] }
# `zeroize` because this is the crate that holds the AEAD key for every format in
# mili. Without it `ChaChaPoly1305`'s `Drop` is empty and the key is released to
# the allocator without being overwritten, which for a key file or a backup is a
# `HKDF(Argon2id(password))` that outlives the file it decrypts.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }
hybrid-array = "=0.4.15"
# The default feature set is turned off, which drops `password-hash`, `rand` and
# `serde`: mili derives a key, it never produces a PHC string to store in a
# password database, and it never verifies one. `alloc` is required for the block
# vector the derivation fills, and `zeroize` because those blocks hold the
# password's memory-hardness work product and have to be cleared on drop.
#
# `base64ct` remains, as argon2's own dependency, for PHC encoding that mili does
# not call. It is a supply chain question rather than a feature question, so it
# is left to `cargo vet` and the advisory database instead of being worked around.
mili-core = { version = "=0.1.0", path = "mili-core" }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }

# Argon2 touches 64 MiB three times per derivation. Unoptimised, one derivation
# takes about two seconds in the development profile, the exhaustive tamper
# sweeps cost one derivation per tested byte, and the suite takes over ten
# minutes instead of four. This changes how the dependency is compiled, not what
# it computes, so the cross implementation vectors still pin the output.
[profile.dev.package.argon2]
opt-level = 3

# Reached only through argon2, and hot for the same reason.
[profile.dev.package.blake2]
opt-level = 3

# A release build for the workspace, stated rather than left to cargo's defaults.
#
# Overflow checks are deliberately not enabled here. mili's own arithmetic cannot
# wrap, because `clippy::arithmetic_side_effects` is denied over the library and
# every operation states how it behaves, so the checks would buy nothing for
# correctness. They would also cost every dependency that a consumer of this
# workspace builds, which is not a cost the consumer asked for: a library does not
# get to choose its caller's profile. Where overflow behaviour has to be caught at
# runtime it is caught by the fuzz build, whose profile in `fuzz/Cargo.toml` turns
# the checks on.
#
# `lto` and `codegen-units = 1` are the two settings worth having here. They cost
# build time and buy better code in the AEAD and key agreement paths, and the
# single codegen unit means the constant time properties the upstream crates
# document are not split across units that a later pass might reorder.
[profile.release]
lto = "fat"
codegen-units = 1
