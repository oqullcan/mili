[workspace]
resolver = "3"
members = ["mili-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
zeroize = "=1.9.0"
getrandom = "=0.4.3"
subtle = { version = "=2.6.1", default-features = false }
hkdf = "=0.13.0"
sha2 = { version = "=0.11.0", default-features = false }
x-wing = { version = "=0.1.0", features = ["getrandom", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }
hybrid-array = "=0.4.15"
