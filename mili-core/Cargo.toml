[package]
name = "mili-core"
description = "Parameter selection and a misuse-resistant wrapper around audited Rust cryptography crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
hkdf.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true
x-wing.workspace = true
chacha20poly1305.workspace = true
ml-dsa.workspace = true
rand_core.workspace = true
ed25519-dalek.workspace = true
hybrid-array.workspace = true
argon2.workspace = true

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ml-kem = "=0.3.2"
proptest = "=1.11.0"

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_qualifications = "warn"
# An `unsafe` block cannot appear, so this has nothing to catch today. It is here
# so that the day the `forbid` is relaxed to `deny`, the parts of unsafe that are
# easy to get wrong are still refused.
unsafe_op_in_unsafe_fn = "deny"

# The restriction and pedantic lints mili denies are declared in `src/lib.rs`,
# with the reason for each next to it. They are not here because most of them fire
# on test code, where "a caller might ignore this" is not a bug, and
# `#![cfg_attr(not(test), ...)]` in the crate root is what scopes them to the
# library. A lint enforced without a stated reason gets removed the first time it
# is inconvenient.
[lints.clippy]
all = { level = "deny", priority = -1 }
